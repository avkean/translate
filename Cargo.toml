[package]
name = "translate"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
axum = "0.8"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time", "signal"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
