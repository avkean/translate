services:
  translate:
    build: .
    container_name: translate
    restart: unless-stopped
    depends_on:
      - privatemode-proxy
    networks:
      - default
      - proxy_net
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m

  # Checks Privatemode's confidential hardware and encrypts each request to it.
  privatemode-proxy:
    image: ghcr.io/edgelesssys/privatemode/privatemode-proxy:v1.58.0
    container_name: translate-privatemode
    restart: unless-stopped
    command: ["--api-key", "@/run/secrets/privatemode_api_key", "--api-key-fallback", "always", "--workspace", "/tmp", "--log-level", "warn"]
    secrets:
      - privatemode_api_key
    user: "65534:65534"
    tmpfs: ["/tmp:mode=1777"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m

secrets:
  privatemode_api_key:
    environment: PRIVATEMODE_API_KEY

networks:
  proxy_net:
    external: true
